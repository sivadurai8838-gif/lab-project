<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Access</title>

<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- Admin Access Popup -->
<div class="popup">

    <h1>Admin Access</h1>

    <p>Please enter admin password</p>

    <div class="input-box">
        <input type="password" id="adminPassword" placeholder="Enter password" autocomplete="off">
    </div>

    <div class="buttons">
        <!-- OK: correct password opens the dashboard -->
        <button type="button" class="btn ok-btn" id="okBtn">OK</button>
        <!-- Cancel: signs out and returns to Home -->
        <button type="button" class="btn cancel-btn" id="cancelBtn">Cancel</button>
    </div>

    <div class="success" id="message"></div>

</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
